name: Cargo CI

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # whisper-rs-sys regenerates its bindings with whatever libclang the
      # runner image ships; on ubuntu-latest that run produced an opaque
      # `whisper_full_params` (only `_address`), so whisper-rs failed with
      # "no field `greedy`". The crate's bundled bindings match its own
      # whisper.cpp checkout, so use them (the Flatpak build pins its own
      # libclang instead).
      WHISPER_DONT_GENERATE_BINDINGS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Part of the cache key, so a cached whisper-rs-sys OUT_DIR
          # generated with libclang is not reused once bindings come from
          # the bundled file (its build script has no rerun-if-env-changed).
          env-vars: WHISPER_DONT_GENERATE_BINDINGS

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-gl \
            libglib2.0-dev \
            frei0r-plugins

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked
